name: Update Open-Source Stats

on:
  schedule:
    - cron: "30 3 * * *" # täglich, eine halbe Stunde nach den Top-Languages-Stats
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update README section
        run: node scripts/oss-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add readme.md
          git commit -m "chore: update open-source stats" || exit 0
          git pull --rebase
          git push
