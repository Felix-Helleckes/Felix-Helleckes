name: Generate Readme Stats

on:
  schedule:
    - cron: "0 3 * * *" # Läuft automatisch jede Nacht um 3:00 Uhr
  workflow_dispatch: # Ermöglicht es dir, den Job jederzeit manuell zu starten

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Top Languages Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=felix-helleckes&layout=compact&theme=dark
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }} # Reicht für öffentliche Repos. Für private Repos ein PAT verwenden.

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/top-langs.svg
          git commit -m "chore: update top languages stats" || exit 0
          git push
